<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo1.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Hanken+Grotesk:wght@300..700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					document.documentElement.classList.add('js');
					var t = localStorage.getItem('lakuna-theme');
					var d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (d) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-fg font-body antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
